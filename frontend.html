<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLOSSEUM</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <style>
    :root {
      --bg: #050a0e;
      --bg2: #0a1520;
      --bg3: #0d1f2d;
      --cyan: #00f5ff;
      --pink: #ff2d7a;
      --yellow: #ffe600;
      --text: #a8d8ea;
      --text-dim: #3a6070;
      --border: #0d4a5c;
      --glow-cyan: 0 0 8px #00f5ff55, 0 0 20px #00f5ff22;
      --glow-pink: 0 0 8px #ff2d7a55, 0 0 20px #ff2d7a22;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,245,255,0.015) 2px,
        rgba(0,245,255,0.015) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* Grid background */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 26px;
      color: var(--cyan);
      text-shadow: var(--glow-cyan);
      letter-spacing: 6px;
      position: relative;
    }

    .logo::after {
      content: 'v0.1.0';
      font-size: 10px;
      color: var(--text-dim);
      position: absolute;
      bottom: -14px;
      left: 2px;
      letter-spacing: 2px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Language selector */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .lang-badge {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 4px 12px;
      text-shadow: var(--glow-cyan);
      box-shadow: var(--glow-cyan);
      position: relative;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    }

    .toolbar-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* Editor wrapper */
    .editor-wrapper {
      position: relative;
      border: 1px solid var(--border);
      background: var(--bg2);
      margin-bottom: 16px;
    }

    .editor-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--pink), transparent);
      z-index: 2;
    }

    .editor-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #28c840; }

    .file-name {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: 8px;
      letter-spacing: 1px;
    }

    #editor { width: 100%; height: 380px; }

    /* Bottom controls */
    .controls {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-run {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--bg);
      background: var(--cyan);
      border: none;
      padding: 12px 32px;
      cursor: pointer;
      clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
      transition: all 0.15s;
      text-shadow: none;
      position: relative;
      overflow: hidden;
    }

    .btn-run::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.4s;
    }

    .btn-run:hover::before { transform: translateX(100%); }
    .btn-run:hover { background: #00ddee; box-shadow: var(--glow-cyan); }
    .btn-run:active { transform: scale(0.97); }

    .btn-run.running {
      background: var(--text-dim);
      cursor: not-allowed;
      animation: none;
    }

    .btn-clear {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid var(--border);
      padding: 12px 20px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-clear:hover {
      color: var(--pink);
      border-color: var(--pink);
      box-shadow: var(--glow-pink);
    }

    .exec-time {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1px;
    }

    /* Output panel */
    .output-wrapper {
      position: relative;
      border: 1px solid var(--border);
      background: var(--bg2);
    }

    .output-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--pink), var(--yellow), transparent);
      z-index: 2;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
    }

    .output-status {
      font-size: 10px;
      padding: 2px 8px;
      border: 1px solid;
      letter-spacing: 1px;
    }

    .output-status.success { color: #00ff88; border-color: #00ff88; }
    .output-status.error { color: var(--pink); border-color: var(--pink); }
    .output-status.timeout { color: var(--text-dim); border-color: var(--text); }
    .output-status.idle { color: var(--text-dim); border-color: var(--border); }

    #output {
      padding: 16px;
      min-height: 120px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text);
    }

    #output.error-output { color: var(--pink); }

    #output .prompt {
      color: var(--text-dim);
      user-select: none;
    }

    /* Loading animation */
    .loading-dots::after {
      content: '';
      animation: dots 1.2s infinite;
    }

    @keyframes dots {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
      100% { content: ''; }
    }

    /* Corner decorations */
    .corner-tl, .corner-br {
      position: absolute;
      width: 12px;
      height: 12px;
      z-index: 3;
    }

    .corner-tl {
      top: -1px; left: -1px;
      border-top: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .corner-br {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">COLOSSEUM</div>
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>SYSTEM ONLINE</span>
      <span style="color: var(--border)">|</span>
      <span id="clock"></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="lang-badge">PYTHON</div>
    <span class="toolbar-label">// EXECUTION ENGINE READY</span>
  </div>

  <div class="editor-wrapper">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="editor-header">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <span class="file-name">python</span>
    </div>
    <div id="editor"></div>
  </div>

  <div class="controls">
    <button class="btn-run" id="runBtn" onclick="runCode()">▶ EXECUTE</button>
    <button class="btn-clear" onclick="clearOutput()">CLEAR</button>
    <div class="exec-time" id="execTime"></div>
  </div>

  <div class="output-wrapper">
    <div class="corner-tl" style="border-color: var(--pink)"></div>
    <div class="corner-br" style="border-color: var(--pink)"></div>
    <div class="output-header">
      <span>// OUTPUT</span>
      <span class="output-status idle" id="outputStatus">IDLE</span>
    </div>
    <pre id="output"><span class="prompt">~$ awaiting execution...</span></pre>
  </div>

</div>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-US', {hour12: false});
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Monaco setup
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});

  let editor;
  require(['vs/editor/editor.main'], function() {
    monaco.editor.defineTheme('cyberpunk', {
      base: 'vs-dark',
      inherit: true,
      rules: [
        { token: 'keyword',  foreground: 'ff2d7a', fontStyle: 'bold' },
        { token: 'string',   foreground: 'ffe600' },
        { token: 'comment',  foreground: '3a6070', fontStyle: 'italic' },
        { token: 'number',   foreground: '00f5ff' },
        { token: 'function', foreground: 'a8d8ea' },
        { token: 'type',     foreground: 'ff8c42' },
      ],
      colors: {
        'editor.background':           '#0a1520',
        'editor.foreground':           '#a8d8ea',
        'editor.lineHighlightBackground': '#0d1f2d',
        'editorLineNumber.foreground': '#1a4a5a',
        'editorLineNumber.activeForeground': '#00f5ff',
        'editor.selectionBackground':  '#00f5ff22',
        'editorCursor.foreground':     '#00f5ff',
        'editorIndentGuide.background1': '#0d4a5c',
      }
    });

    editor = monaco.editor.create(document.getElementById('editor'), {
      value: '# Welcome to COLOSSEUM\nprint("Hello, World!")\n\nx = [i**2 for i in range(10)]\nprint(x)',
      language: 'python',
      theme: 'cyberpunk',
      fontSize: 14,
      lineHeight: 22,
      fontFamily: "'Share Tech Mono', monospace",
      minimap: { enabled: false },
      automaticLayout: true,
      scrollBeyondLastLine: false,
      renderLineHighlight: 'line',
      padding: { top: 12, bottom: 12 },
    });
  });

  async function runCode() {
    if (!editor) return;

    const btn = document.getElementById('runBtn');
    const output = document.getElementById('output');
    const status = document.getElementById('outputStatus');
    const execTime = document.getElementById('execTime');

    btn.textContent = '⟳ RUNNING';
    btn.classList.add('running');
    btn.disabled = true;
    output.className = '';
    output.innerHTML = '<span class="loading-dots">// EXECUTING</span>';
    status.textContent = 'RUNNING';
    status.className = 'output-status idle';
    execTime.textContent = '';

    const start = performance.now();
    const code = editor.getValue();

    try {
      const response = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });

      console.log(response.status)
      if (response.status === 429) {
          document.getElementById('output').textContent = '// RATE LIMITED: Please wait for 3 seconds before submitting again';
          output.className = 'error-output';
          status.textContent = 'RATE LIMITED';
          status.className = 'output-status error';
          return;
      }

      const elapsed = ((performance.now() - start) / 1000).toFixed(2);
      execTime.textContent = `⏱ ${elapsed}s`;

      const result = await response.json();
      const text = typeof result === 'string' ? result : (result.output);

      const isError = result.status.toLowerCase().includes('error');
      const isTimeout = result.status.toLowerCase().includes('timeout');


      output.textContent = text || '(no output)';
      output.className = isError ? 'error-output' : '';
      status.textContent = result.status
      status.className = `output-status ${isError ? 'error' : isTimeout ? 'timeout' : 'success'}`;

    } catch (err) {

      console.log(err)
      output.textContent = '// CONNECTION FAILED\n// Is the backend running?';
      output.className = 'error-output';
      status.textContent = 'ERROR';
      status.className = 'output-status error';
    } finally{
      btn.textContent = '▶ EXECUTE';
      btn.classList.remove('running');
      btn.disabled = false;
    }
  }

  function clearOutput() {
    const output = document.getElementById('output');
    const status = document.getElementById('outputStatus');
    output.innerHTML = '<span class="prompt">~$ awaiting execution...</span>';
    output.className = '';
    status.textContent = 'IDLE';
    status.className = 'output-status idle';
    document.getElementById('execTime').textContent = '';
  }
</script>
</body>
</html>
